name: test-flow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight gate: main-source changes should ship with tests.
  test-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for origin/main...HEAD diff
      - name: Require tests for main-source changes
        shell: bash
        run: |
          # Skip on push-to-main when no base ref is available.
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "No origin/main base; skipping test-policy gate."
            exit 0
          fi
          MAIN_CHANGED=$(git diff --name-only origin/main...HEAD -- 'app/src/main/**')
          TEST_CHANGED=$(git diff --name-only origin/main...HEAD -- '**/*Test.kt' 'app/src/test/**' 'app/src/androidTest/**')
          if [ -n "$MAIN_CHANGED" ] && [ -z "$TEST_CHANGED" ]; then
            echo "::error::app/src/main changed but no tests changed. Add/extend *Test.kt (unit) or androidTest coverage."
            echo "$MAIN_CHANGED"
            exit 1
          fi
          echo "test-policy OK."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9.5.1 + Gradle 9.6 need JDK 17+ to run; bytecode target stays
      # Java 11 via compileOptions, so Temurin 17 is the minimal toolchain.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Configuration-cache-aware Gradle caching; Android SDK is preinstalled
      # on ubuntu-latest, so no setup-android step needed.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Validates wrapper + toolchain without building.
      - name: Validate Gradle setup
        run: ./gradlew --version

      # Cheapest Kotlin typecheck gate: proves sources compile without
      # paying for full APK packaging (packaging is covered by the smoke step).
      - name: Typecheck (Kotlin compile)
        run: ./gradlew :app:compileDebugKotlin

      # MUST fail the workflow on test failure: no --continue, fail fast.
      # Configuration-cache compatible per gradle.properties.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Expo-export equivalent: proves packaging works. Debug (not release/
      # bundle) avoids signing secrets and R8 overhead on PRs.
      - name: Bundle smoke test
        run: ./gradlew :app:assembleDebug
