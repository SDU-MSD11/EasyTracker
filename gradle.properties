# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9.5.1 built-in Kotlin disallows kotlin.sourceSets injection, which KSP
# (Hilt + Room) still uses for generated sources. Re-allow until KSP migrates
# to android.sourceSets. Cache-safe project property.
android.disallowKotlinSourceSets=false
# --- Local daemon JDK pin (VSCode-JRE jlink trap) ---
# Symptom: :app:compileDebugJavaWithJavac fails in JdkImageTransform:
# core-for-system-modules.jar with
#   jlink executable C:\Users\Mads\.vscode\extensions\redhat.java-...\jre\...\bin\jlink.exe does not exist
# Cause: daemon launched on the VSCode RedHat Java JRE-only runtime (no jlink);
# AGP 9.5.1 needs a full JDK to run jlink against SDK platform android-37.0.
# Fix (machine-local): in %USERPROFILE%\.gradle\gradle.properties set:
#   org.gradle.java.home=E:\\Android\\Android Studio\\jbr
# (Full JDK with bin\jlink.exe, OpenJDK 25; satisfies Gradle 9.6 + AGP 9.5.1
# need-JDK-17+; bytecode target stays Java 11 via compileOptions.)
# Kept commented here on purpose: this file is committed, so an active Windows
# path would break CI (ubuntu-latest, Temurin 17 via setup-java JAVA_HOME, no
# E:\ path) and other machines. CI ignores this comment and needs no workflow
# change. Per header above, IDE Gradle settings override this file, so keep the
# IDE JDK in sync. After setting, run ./gradlew --stop, then validate narrowly.
# No toolchain spec added: JdkImageTransform runs on the daemon JDK, and
# settings.gradle.kts already applies foojay-resolver-convention 1.0.0.
# org.gradle.java.home=E:\\Android\\Android Studio\\jbr